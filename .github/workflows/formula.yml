name: Verify public Homebrew formula

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Formula/obsdog.rb
      - .github/workflows/formula.yml
  pull_request:
    paths:
      - Formula/obsdog.rb
      - .github/workflows/formula.yml

permissions:
  contents: read

concurrency:
  group: formula-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Load the reviewed formula on an Apple silicon runner
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          brew tap obsdoghq/tap
          tap_directory="$(brew --repository obsdoghq/tap)"
          [[ -d "$tap_directory/Formula" ]]
          cp "$GITHUB_WORKSPACE/Formula/obsdog.rb" "$tap_directory/Formula/obsdog.rb"
          cmp "$GITHUB_WORKSPACE/Formula/obsdog.rb" "$tap_directory/Formula/obsdog.rb"
      - name: Style and strict audit
        run: |
          brew style obsdoghq/tap/obsdog
          brew audit --strict obsdoghq/tap/obsdog
      - name: Inspect the runner's anonymous public API budget
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 15 --dump-header - --output /dev/null \
            https://api.github.com/repos/obsdoghq/obsdog-releases/releases/latest \
            | awk 'tolower($0) ~ /^(http\/|x-ratelimit-|retry-after:)/'
      - name: Install the public binary and run synthetic acceptance
        run: |
          brew install obsdoghq/tap/obsdog
          brew test obsdoghq/tap/obsdog --verbose
      - name: Verify the public updater outside the formula sandbox
        shell: bash
        env:
          # Homebrew deliberately clears token variables from formula tests.
          # CI-only public lookup; never a maintainer credential.
          OBSDOG_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          task_profile="$(mktemp -d)"
          trap 'rm -rf "$task_profile"' EXIT
          export OBSDOG_HOME="$task_profile" OBSDOG_NO_UPDATE_NOTIFIER=1
          cli="$(brew --prefix obsdoghq/tap/obsdog)/bin/obsdog"
          version="$("$cli" version)"
          before="$(shasum -a 256 "$cli")"
          "$cli" update --check --format json | jq -e --arg version "$version" '
            .ok and .data.owner=="homebrew" and
            .data.current_version==$version and .data.latest_version==$version and
            .data.instruction=="brew upgrade obsdoghq/tap/obsdog" and
            .data.update_available==false and .data.updated==false'
          [[ "$before" == "$(shasum -a 256 "$cli")" ]]
